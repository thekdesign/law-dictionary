<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- 圓角深藍底（對應 primary-800 #13203D） -->
    <rect width="64" height="64" rx="14" fill="#13203D"/>

    <!-- 微妙漸層光暈，讓底色更立體 -->
    <defs>
        <radialGradient id="glow" cx="50%" cy="38%" r="55%">
            <stop offset="0%" stop-color="#3E5790" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#13203D" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="url(#glow)"/>

    <!-- 天平垂直支柱 -->
    <rect x="30.5" y="12" width="3" height="38" rx="1.5" fill="#E2C25A"/>

    <!-- 頂飾(小寶石) -->
    <circle cx="32" cy="11" r="2.6" fill="#F0DC92"/>
    <circle cx="32" cy="11" r="1" fill="#13203D"/>

    <!-- 橫桿 -->
    <rect x="12" y="19" width="40" height="2.5" rx="1.25" fill="#E2C25A"/>

    <!-- 左右繫繩 -->
    <line x1="18" y1="21.5" x2="14" y2="32" stroke="#E2C25A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="18" y1="21.5" x2="22" y2="32" stroke="#E2C25A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="46" y1="21.5" x2="42" y2="32" stroke="#E2C25A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="46" y1="21.5" x2="50" y2="32" stroke="#E2C25A" stroke-width="1.4" stroke-linecap="round"/>

    <!-- 左秤盤 -->
    <path d="M 11 32 Q 18 39 25 32 Z" fill="#E2C25A"/>
    <ellipse cx="18" cy="32" rx="7" ry="1.2" fill="#A88216"/>

    <!-- 右秤盤 -->
    <path d="M 39 32 Q 46 39 53 32 Z" fill="#E2C25A"/>
    <ellipse cx="46" cy="32" rx="7" ry="1.2" fill="#A88216"/>

    <!-- 底座 -->
    <rect x="22" y="48" width="20" height="3" rx="1.5" fill="#E2C25A"/>
    <rect x="26" y="51" width="12" height="2" rx="1" fill="#A88216"/>

    <!-- 奇想閃光點綴（右上）-->
    <g opacity="0.9">
        <circle cx="52" cy="13" r="0.8" fill="#F0DC92"/>
        <path d="M 52 10 L 52 16 M 49 13 L 55 13" stroke="#F0DC92" stroke-width="0.7" stroke-linecap="round"/>
    </g>

    <!-- 奇想閃光點綴（左下）-->
    <g opacity="0.7">
        <circle cx="11" cy="52" r="0.6" fill="#F0DC92"/>
        <path d="M 11 50 L 11 54 M 9 52 L 13 52" stroke="#F0DC92" stroke-width="0.5" stroke-linecap="round"/>
    </g>
</svg>
